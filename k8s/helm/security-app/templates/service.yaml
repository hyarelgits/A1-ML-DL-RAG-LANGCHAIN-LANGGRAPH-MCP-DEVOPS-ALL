apiVersion: v1
# # apiVersion v1 = Service API
kind: Service
# # kind Service = This file is Service
metadata:
  name: security-app
  # # name = Service name
spec:
  type: NodePort
  # # type NodePort = Expose via NodePort
  selector:
    app: security-app
    # # selector = Send traffic to pods with label app=security-app
  ports:
  - port: 8000
    # # port = Service port 8000
    targetPort: 8000
    # # targetPort = Container port 8000
    nodePort: 30800
    # # nodePort = Outside port 30800 - Open in browser via 30800
